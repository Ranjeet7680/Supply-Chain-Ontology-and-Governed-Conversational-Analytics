<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 460" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="50%" stop-color="#0B1528"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="glowEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="glowAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <style>
    .arch-title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 22px; fill: #FFFFFF; letter-spacing: -0.3px; }
    .arch-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94A3B8; }
    .node-header { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #FFFFFF; }
    .node-item { font-family: 'Courier New', monospace; font-size: 10px; fill: #CBD5E1; }
    .tag-text { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }

    @keyframes flowLineHorizontal {
      to { stroke-dashoffset: -60; }
    }
    @keyframes pulseNodeGlow {
      0% { r: 5px; opacity: 0.8; }
      50% { r: 12px; opacity: 0.2; }
      100% { r: 5px; opacity: 0.8; }
    }
    @keyframes rotateRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes chipBlink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .circuit-wire {
      stroke-dasharray: 6, 8;
      animation: flowLineHorizontal 1.8s linear infinite;
    }
    .circuit-fast {
      stroke-dasharray: 8, 12;
      animation: flowLineHorizontal 1.2s linear infinite;
    }
    .ping-circle {
      animation: pulseNodeGlow 2s ease-in-out infinite;
    }
    .blinking-led {
      animation: chipBlink 1.5s ease-in-out infinite;
    }
  </style>

  <!-- Container Box -->
  <rect width="1150" height="460" rx="18" fill="url(#archBg)" stroke="#1E293B" stroke-width="1.8"/>

  <!-- Cybernetic Background Grid -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="0.8">
    <line x1="0" y1="80" x2="1150" y2="80"/>
    <line x1="0" y1="160" x2="1150" y2="160"/>
    <line x1="0" y1="240" x2="1150" y2="240"/>
    <line x1="0" y1="320" x2="1150" y2="320"/>
    <line x1="0" y1="400" x2="1150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="460"/>
    <line x1="430" y1="0" x2="430" y2="460"/>
    <line x1="680" y1="0" x2="680" y2="460"/>
    <line x1="910" y1="0" x2="910" y2="460"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(45, 34)">
    <rect x="0" y="0" width="300" height="22" rx="11" fill="#1E293B" stroke="#334155"/>
    <circle cx="12" cy="11" r="4" fill="#38BDF8" class="blinking-led"/>
    <text x="24" y="15" class="tag-text" fill="#38BDF8">SYSTEM ARCHITECTURE · CIRCUIT DATAFLOW</text>

    <text x="0" y="52" class="arch-title">Snowflake Cortex Analyst + PyTorch Spatial GNN &amp; RL Core</text>
    <text x="0" y="72" class="arch-sub">End-to-end telemetry flow from multi-modal logistics sensors to autonomous MCP action execution.</text>
  </g>

  <!-- CONNECTING CIRCUIT LINES WITH MOVING PULSES -->
  <g fill="none">
    <!-- Stage 1 -> Stage 2 -->
    <path d="M 215 250 L 265 250" stroke="#334155" stroke-width="3"/>
    <path d="M 215 250 L 265 250" stroke="#38BDF8" stroke-width="3" class="circuit-fast" filter="url(#neonGlow)"/>

    <!-- Stage 2 -> Stage 3 -->
    <path d="M 465 250 L 515 250" stroke="#334155" stroke-width="3"/>
    <path d="M 465 250 L 515 250" stroke="#A855F7" stroke-width="3" class="circuit-fast" filter="url(#neonGlow)"/>

    <!-- Stage 3 -> Stage 4 -->
    <path d="M 715 250 L 765 250" stroke="#334155" stroke-width="3"/>
    <path d="M 715 250 L 765 250" stroke="#10B981" stroke-width="3" class="circuit-fast" filter="url(#neonGlow)"/>

    <!-- Stage 4 -> Stage 5 -->
    <path d="M 945 250 L 985 250" stroke="#334155" stroke-width="3"/>
    <path d="M 945 250 L 985 250" stroke="#F59E0B" stroke-width="3" class="circuit-fast" filter="url(#neonGlow)"/>

    <!-- CoCo Skill Governance Loop (Feedback Arc) -->
    <path d="M 365 140 Q 365 110 490 110 Q 615 110 615 140" stroke="#00F2FE" stroke-width="2" class="circuit-wire" filter="url(#neonGlow)"/>
    <circle cx="490" cy="110" r="10" fill="#0F172A" stroke="#00F2FE" stroke-width="1.5"/>
    <text x="490" y="114" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="9px" fill="#00F2FE" text-anchor="middle">CoCo</text>
  </g>

  <!-- ============================================================== -->
  <!-- 1. MULTIMODAL INGESTION                                        -->
  <!-- ============================================================== -->
  <g transform="translate(45, 140)">
    <rect width="170" height="280" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.4" filter="url(#subtleBlur)"/>
    <rect x="14" y="14" width="75" height="18" rx="4" fill="#0369A1"/>
    <text x="20" y="27" class="tag-text" fill="#E0F2FE">1. INGESTION</text>
    <circle cx="148" cy="23" r="4" fill="#38BDF8" class="blinking-led"/>

    <text x="14" y="60" class="node-header">Multi-Modal Telemetry</text>
    <text x="14" y="78" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#64748B">Structured + Unstructured</text>

    <g transform="translate(14, 96)">
      <rect width="142" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="10" y="18" class="node-item">🚚 25,000 TMS Shipments</text>

      <rect y="36" width="142" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="10" y="54" class="node-item">🏢 113,097 SC Nodes</text>

      <rect y="72" width="142" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="10" y="90" class="node-item">🌩️ Live Weather Feeds</text>

      <rect y="108" width="142" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="10" y="126" class="node-item">🎙️ Voice PCM Streams</text>

      <rect y="144" width="142" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="10" y="162" class="node-item">📊 LEADS Logistics Index</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 2. MEDALLION LAKEHOUSE & CORTEX                                -->
  <!-- ============================================================== -->
  <g transform="translate(265, 140)">
    <rect width="200" height="280" rx="14" fill="#0F172A" stroke="#00F2FE" stroke-width="1.8" filter="url(#subtleBlur)"/>
    <rect x="14" y="14" width="95" height="18" rx="4" fill="#0E7490"/>
    <text x="20" y="27" class="tag-text" fill="#E0F2FE">2. SNOWFLAKE LAKE</text>
    <circle cx="178" cy="23" r="4" fill="#00F2FE" class="blinking-led"/>

    <text x="14" y="60" class="node-header">Governed Medallion</text>
    <text x="14" y="78" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#64748B">Bronze → Silver → Gold</text>

    <g transform="translate(14, 96)">
      <rect width="172" height="30" rx="6" fill="#1E293B" stroke="#0284C7"/>
      <text x="10" y="19" class="node-item">BRONZE: Raw Staging Ingest</text>

      <rect y="38" width="172" height="30" rx="6" fill="#1E293B" stroke="#0284C7"/>
      <text x="10" y="57" class="node-item">SILVER: 8 Referential Tables</text>

      <rect y="76" width="172" height="30" rx="6" fill="#1E293B" stroke="#00F2FE"/>
      <text x="10" y="95" class="node-item">GOLD: Canonical OTIF Views</text>

      <rect y="114" width="172" height="30" rx="6" fill="#1E293B" stroke="#38BDF8"/>
      <text x="10" y="133" class="node-item">CORTEX: semantic_model.yaml</text>

      <rect y="152" width="172" height="24" rx="6" fill="#0369A1" opacity="0.3"/>
      <text x="86" y="168" font-family="'Segoe UI', sans-serif" font-size="10px" font-weight="700" fill="#38BDF8" text-anchor="middle">Zero-Drift Attestation ✓</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 3. ADVANCED AI / PYTORCH / GNN                                 -->
  <!-- ============================================================== -->
  <g transform="translate(515, 140)">
    <rect width="200" height="280" rx="14" fill="#0F172A" stroke="#A855F7" stroke-width="1.8" filter="url(#subtleBlur)"/>
    <rect x="14" y="14" width="85" height="18" rx="4" fill="#6B21A8"/>
    <text x="20" y="27" class="tag-text" fill="#F3E8FF">3. AI &amp; GNN CORE</text>
    <circle cx="178" cy="23" r="4" fill="#A855F7" class="blinking-led"/>

    <text x="14" y="60" class="node-header">Deep Learning &amp; RL</text>
    <text x="14" y="78" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#64748B">Prescriptive Autonomy</text>

    <g transform="translate(14, 96)">
      <rect width="172" height="30" rx="6" fill="#1E293B" stroke="#9333EA"/>
      <text x="10" y="19" class="node-item">RandomForest: 89.58% Acc</text>

      <rect y="38" width="172" height="30" rx="6" fill="#1E293B" stroke="#A855F7"/>
      <text x="10" y="57" class="node-item">DeepRiskNet: Attention Net</text>

      <rect y="76" width="172" height="30" rx="6" fill="#1E293B" stroke="#C084FC"/>
      <text x="10" y="95" class="node-item">PyTorch Spatial GNN (113k)</text>

      <rect y="114" width="172" height="30" rx="6" fill="#1E293B" stroke="#EC4899"/>
      <text x="10" y="133" class="node-item">RL Q-Learning Policy (+28%)</text>

      <rect y="152" width="172" height="24" rx="6" fill="#581C87" opacity="0.3"/>
      <text x="86" y="168" font-family="'Segoe UI', sans-serif" font-size="10px" font-weight="700" fill="#E9D5FF" text-anchor="middle">SHAP Waterfall XAI ✓</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 4. PROTOCOL & FASTAPI SERVICES                                -->
  <!-- ============================================================== -->
  <g transform="translate(765, 140)">
    <rect width="180" height="280" rx="14" fill="#0F172A" stroke="#10B981" stroke-width="1.8" filter="url(#subtleBlur)"/>
    <rect x="14" y="14" width="80" height="18" rx="4" fill="#065F46"/>
    <text x="20" y="27" class="tag-text" fill="#D1FAE5">4. SERVICES</text>
    <circle cx="158" cy="23" r="4" fill="#10B981" class="blinking-led"/>

    <text x="14" y="60" class="node-header">MCP &amp; Microservices</text>
    <text x="14" y="78" font-family="'Segoe UI', sans-serif" font-size="11px" fill="#64748B">FastAPI Gateway :8000</text>

    <g transform="translate(14, 96)">
      <rect width="152" height="30" rx="6" fill="#1E293B" stroke="#059669"/>
      <text x="10" y="19" class="node-item">Model Context Protocol</text>

      <rect y="38" width="152" height="30" rx="6" fill="#1E293B" stroke="#10B981"/>
      <text x="10" y="57" class="node-item">Semantic Cache (&lt;1.8ms)</text>

      <rect y="76" width="152" height="30" rx="6" fill="#1E293B" stroke="#34D399"/>
      <text x="10" y="95" class="node-item">Drift PSI Monitor (KS)</text>

      <rect y="114" width="152" height="30" rx="6" fill="#1E293B" stroke="#6EE7B7"/>
      <text x="10" y="133" class="node-item">Auto ERP / TMS Dispatch</text>

      <rect y="152" width="152" height="24" rx="6" fill="#064E3B" opacity="0.4"/>
      <text x="76" y="168" font-family="'Segoe UI', sans-serif" font-size="10px" font-weight="700" fill="#A7F3D0" text-anchor="middle">-$12,400 Penalties ✓</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 5. 3D DIGITAL TWIN & INTERACTION                              -->
  <!-- ============================================================== -->
  <g transform="translate(985, 140)">
    <rect width="120" height="280" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-width="1.8" filter="url(#subtleBlur)"/>
    <rect x="12" y="14" width="55" height="18" rx="4" fill="#78350F"/>
    <text x="16" y="27" class="tag-text" fill="#FEF3C7">5. UI/VOX</text>
    <circle cx="102" cy="23" r="4" fill="#F59E0B" class="blinking-led"/>

    <text x="12" y="60" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12px" fill="#FFFFFF">3D Twin &amp; Vox</text>
    <text x="12" y="78" font-family="'Segoe UI', sans-serif" font-size="10px" fill="#64748B">Web &amp; Streamlit</text>

    <g transform="translate(10, 96)">
      <rect width="100" height="34" rx="6" fill="#1E293B" stroke="#D97706"/>
      <text x="8" y="16" font-family="monospace" font-size="9px" fill="#FEF3C7">Three.js Globe</text>
      <text x="8" y="28" font-family="'Segoe UI', sans-serif" font-size="8px" fill="#94A3B8">India-GCC Arcs</text>

      <rect y="40" width="100" height="34" rx="6" fill="#1E293B" stroke="#F59E0B"/>
      <text x="8" y="56" font-family="monospace" font-size="9px" fill="#FEF3C7">Web Audio FX</text>
      <text x="8" y="68" font-family="'Segoe UI', sans-serif" font-size="8px" fill="#94A3B8">Synthesizer FX</text>

      <rect y="80" width="100" height="34" rx="6" fill="#1E293B" stroke="#FBBF24"/>
      <text x="8" y="96" font-family="monospace" font-size="9px" fill="#FEF3C7">7 Langs Voice</text>
      <text x="8" y="108" font-family="'Segoe UI', sans-serif" font-size="8px" fill="#94A3B8">HI/TA/TE/GU/MR</text>

      <rect y="120" width="100" height="34" rx="6" fill="#1E293B" stroke="#FDE68A"/>
      <text x="8" y="136" font-family="monospace" font-size="9px" fill="#FEF3C7">Vercel &amp; Pages</text>
      <text x="8" y="148" font-family="'Segoe UI', sans-serif" font-size="8px" fill="#94A3B8">Live Deploy</text>
    </g>
  </g>
</svg>
