<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#02040A" />
    </linearGradient>

    <!-- Neon Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Neon Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Neon Purple Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 46px; fill: #FFFFFF; letter-spacing: -0.5px; }
    .subtitle-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 17px; fill: #00F2FE; letter-spacing: 2px; text-transform: uppercase; }
    .tagline-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; fill: #94A3B8; }
    .kpi-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #94A3B8; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
    .kpi-val { font-family: 'Courier New', monospace; font-size: 22px; font-weight: 800; }
    
    @keyframes pulseCircle {
      0% { r: 5; opacity: 0.9; }
      50% { r: 16; opacity: 0.15; }
      100% { r: 5; opacity: 0.9; }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.96); opacity: 0.8; }
      50% { transform: scale(1.04); opacity: 0.3; }
      100% { transform: scale(0.96); opacity: 0.8; }
    }
    @keyframes dashRoute {
      to { stroke-dashoffset: -100; }
    }
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }
    @keyframes scanline {
      0% { y: 0; opacity: 0.4; }
      50% { y: 420; opacity: 0.1; }
      100% { y: 0; opacity: 0.4; }
    }

    .animated-route {
      stroke-dasharray: 8, 6;
      animation: dashRoute 3s linear infinite;
    }
    .pulse-node {
      animation: pulseCircle 2.5s ease-in-out infinite;
    }
    .pulse-node-2 {
      animation: pulseCircle 3.2s ease-in-out infinite 0.8s;
    }
    .pulse-node-3 {
      animation: pulseCircle 2.8s ease-in-out infinite 1.4s;
    }
    .floating-card-1 {
      animation: floatCard 4s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatCard 4.5s ease-in-out infinite 0.7s;
    }
    .floating-card-3 {
      animation: floatCard 4.2s ease-in-out infinite 1.4s;
    }
    .floating-card-4 {
      animation: floatCard 4.8s ease-in-out infinite 2.1s;
    }
  </style>

  <!-- Deep Sci-Fi Background Canvas -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Cybernetic Grid Overlay -->
  <g opacity="0.12" stroke="#4FACFE" stroke-width="0.8">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Animated Corridor Connections (India to GCC Map Visualization) -->
  <g opacity="0.75">
    <!-- Hub: Mumbai / JNPT (India) -->
    <circle cx="1060" cy="220" r="8" fill="#00F2FE" filter="url(#glowCyan)"/>
    <circle cx="1060" cy="220" r="18" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.6" class="pulse-node"/>
    <text x="1060" y="245" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94A3B8" font-weight="700" text-anchor="middle">JNPT / MUMBAI</text>

    <!-- Hub: Mundra Port (Gujarat) -->
    <circle cx="1020" cy="140" r="6" fill="#10B981" filter="url(#glowEmerald)"/>
    <circle cx="1020" cy="140" r="14" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.6" class="pulse-node-2"/>
    <text x="1020" y="125" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94A3B8" font-weight="700" text-anchor="middle">MUNDRA HUB</text>

    <!-- Hub: Jebel Ali / Dubai (UAE) -->
    <circle cx="780" cy="130" r="8" fill="#8B5CF6" filter="url(#glowPurple)"/>
    <circle cx="780" cy="130" r="18" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6" class="pulse-node-3"/>
    <text x="780" y="112" font-family="'Segoe UI', sans-serif" font-size="11" fill="#C4B5FD" font-weight="700" text-anchor="middle">JEBEL ALI (DXB)</text>

    <!-- Hub: Dammam / King Abdulaziz (Saudi) -->
    <circle cx="700" cy="210" r="7" fill="#F59E0B" filter="url(#glowCyan)"/>
    <circle cx="700" cy="210" r="15" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.6" class="pulse-node"/>
    <text x="700" y="235" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FCD34D" font-weight="700" text-anchor="middle">DAMMAM (KSA)</text>

    <!-- Animated Arc: JNPT to Jebel Ali -->
    <path d="M 1060 220 Q 920 120 780 130" fill="none" stroke="#00F2FE" stroke-width="2.5" class="animated-route" filter="url(#subtleGlow)"/>

    <!-- Animated Arc: Mundra to Dammam -->
    <path d="M 1020 140 Q 860 240 700 210" fill="none" stroke="#10B981" stroke-width="2.5" class="animated-route" filter="url(#subtleGlow)"/>

    <!-- Animated Arc: Jebel Ali to Dammam feeder -->
    <path d="M 780 130 Q 740 165 700 210" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,4" class="animated-route"/>
  </g>

  <!-- Left Header Content -->
  <g transform="translate(60, 50)">
    <!-- Hackathon Subtitle Tag -->
    <rect x="0" y="0" width="370" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#10B981" filter="url(#glowEmerald)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#E2E8F0" letter-spacing="1.2">SNOWFLAKE COCO CLI HACKATHON · GCC</text>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="72" class="title-text">
      SupplyChain <tspan fill="url(#cyanGrad)">IQ</tspan>
    </text>

    <!-- Secondary Tagline -->
    <text x="0" y="104" class="subtitle-text">
      Ontology &amp; Governed Conversational Intelligence
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="132" class="tagline-text">
      Zero-Drift Cross-Persona Grounding · Graph Neural Networks · Snowpark ML
    </text>
    <text x="0" y="152" class="tagline-text">
      India ⇄ GCC Trade Corridors · Real-Time Voice AI (Hindi, Tamil, Telugu, Gujarati)
    </text>

    <!-- Team Nexora Badge -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="460" height="34" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" opacity="0.9" />
      <text x="14" y="21" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38BDF8">🏆 TEAM NEXORA</text>
      <text x="135" y="21" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94A3B8">Ranjeet Kumar · Hitali Khachane · Rahul Sangral · Syed Saaduddin</text>
    </g>
  </g>

  <!-- Bottom Metric & Tech KPI Cards -->
  <g transform="translate(60, 275)">
    <!-- KPI 1: OTIF Lift -->
    <g class="floating-card-1" transform="translate(0, 0)">
      <rect width="250" height="95" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.4" opacity="0.95" filter="url(#subtleGlow)"/>
      <rect x="14" y="14" width="6" height="24" rx="3" fill="#10B981" />
      <text x="28" y="24" class="kpi-title">CANONICAL OTIF LIFT</text>
      <text x="28" y="58" class="kpi-val" fill="#10B981">+28.4%</text>
      <text x="28" y="78" font-family="'Segoe UI', sans-serif" font-size="11" fill="#6EE7B7">22.91% Grounded Baseline</text>
    </g>

    <!-- KPI 2: Cost Avoidance -->
    <g class="floating-card-2" transform="translate(275, 0)">
      <rect width="250" height="95" rx="12" fill="#0F172A" stroke="#00F2FE" stroke-width="1.4" opacity="0.95" filter="url(#subtleGlow)"/>
      <rect x="14" y="14" width="6" height="24" rx="3" fill="#00F2FE" />
      <text x="28" y="24" class="kpi-title">DEMURRAGE SAVED</text>
      <text x="28" y="58" class="kpi-val" fill="#00F2FE">-$12,400</text>
      <text x="28" y="78" font-family="'Segoe UI', sans-serif" font-size="11" fill="#7DD3FC">Per Disrupted Vessel Batch</text>
    </g>

    <!-- KPI 3: Query Latency -->
    <g class="floating-card-3" transform="translate(550, 0)">
      <rect width="250" height="95" rx="12" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.4" opacity="0.95" filter="url(#subtleGlow)"/>
      <rect x="14" y="14" width="6" height="24" rx="3" fill="#8B5CF6" />
      <text x="28" y="24" class="kpi-title">SEMANTIC CACHE LATENCY</text>
      <text x="28" y="58" class="kpi-val" fill="#C084FC">&lt; 1.8 ms</text>
      <text x="28" y="78" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E9D5FF">Zero-Drift Attestation</text>
    </g>

    <!-- KPI 4: ML ROC-AUC -->
    <g class="floating-card-4" transform="translate(825, 0)">
      <rect width="255" height="95" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="1.4" opacity="0.95" filter="url(#subtleGlow)"/>
      <rect x="14" y="14" width="6" height="24" rx="3" fill="#F59E0B" />
      <text x="28" y="24" class="kpi-title">PREDICTIVE ROC-AUC</text>
      <text x="28" y="58" class="kpi-val" fill="#FBBF24">0.9664</text>
      <text x="28" y="78" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FDE68A">89.58% Delay Accuracy</text>
    </g>
  </g>
</svg>
