<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="100%" height="100%">
  <defs>
    <linearGradient id="impactBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#02040A"/>
    </linearGradient>

    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>

    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title-txt { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 22px; fill: #FFFFFF; }
    .sub-txt { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94A3B8; }
    .metric-big { font-family: 'Courier New', monospace; font-weight: 900; font-size: 28px; }
    .card-label { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; }

    @keyframes barFill1 {
      0% { width: 0px; }
      100% { width: 200px; }
    }
    @keyframes barFill2 {
      0% { width: 0px; }
      100% { width: 175px; }
    }
    @keyframes barFill3 {
      0% { width: 0px; }
      100% { width: 215px; }
    }
    @keyframes barFill4 {
      0% { width: 0px; }
      100% { width: 190px; }
    }
    @keyframes pulseCard {
      0% { opacity: 0.85; }
      50% { opacity: 1; filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.4)); }
      100% { opacity: 0.85; }
    }

    .bar-anim-1 { animation: barFill1 2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .bar-anim-2 { animation: barFill2 2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s; }
    .bar-anim-3 { animation: barFill3 2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s; }
    .bar-anim-4 { animation: barFill4 2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.6s; }
    .glow-card { animation: pulseCard 3.5s infinite ease-in-out; }
  </style>

  <!-- Background Box -->
  <rect width="1100" height="440" rx="16" fill="url(#impactBg)" stroke="#1E293B" stroke-width="1.8"/>

  <!-- Subtle Blueprint Tech Lines -->
  <g opacity="0.1" stroke="#38BDF8" stroke-width="0.8">
    <line x1="0" y1="70" x2="1100" y2="70"/>
    <line x1="0" y1="180" x2="1100" y2="180"/>
    <line x1="0" y1="310" x2="1100" y2="310"/>
    <line x1="280" y1="0" x2="280" y2="440"/>
    <line x1="550" y1="0" x2="550" y2="440"/>
    <line x1="820" y1="0" x2="820" y2="440"/>
  </g>

  <!-- Header -->
  <g transform="translate(45, 38)">
    <rect x="0" y="0" width="280" height="22" rx="11" fill="#1E293B" stroke="#334155"/>
    <circle cx="12" cy="11" r="4" fill="#10B981"/>
    <text x="24" y="15" class="card-label" fill="#34D399">CRITERIA 3 · QUANTIFIED IMPACT</text>

    <text x="0" y="52" class="title-txt">Enterprise ROI, Latency &amp; Predictive Accuracy Matrix</text>
    <text x="0" y="74" class="sub-txt">Empirical outcome verification across 25,000 dispatches and 14-day simulated policy trajectories.</text>
  </g>

  <!-- ============================================================== -->
  <!-- 4 ANIMATED METRIC HERO CARDS                                    -->
  <!-- ============================================================== -->
  <g transform="translate(45, 140)">
    
    <!-- CARD 1: OTIF Lift -->
    <g transform="translate(0, 0)">
      <rect width="235" height="260" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5" class="glow-card"/>
      <rect x="16" y="16" width="6" height="22" rx="3" fill="#10B981"/>
      <text x="30" y="32" class="card-label" fill="#6EE7B7">ON-TIME DELIVERY</text>

      <text x="16" y="78" class="metric-big" fill="#10B981">+28.4%</text>
      <text x="16" y="98" font-family="'Segoe UI', sans-serif" font-size="12px" fill="#A7F3D0">84.6% RL vs 65.8% Heuristic</text>

      <!-- Animated Progress Bar -->
      <rect x="16" y="125" width="200" height="10" rx="5" fill="#1E293B"/>
      <rect x="16" y="125" height="10" rx="5" fill="url(#gradEmerald)" class="bar-anim-1"/>

      <g transform="translate(16, 160)">
        <text x="0" y="0" font-family="monospace" font-size="11px" fill="#94A3B8">Baseline: 62.4% (Siloed)</text>
        <text x="0" y="20" font-family="monospace" font-size="11px" fill="#6EE7B7">Prescribed: 84.6% (RL)</text>
        <text x="0" y="40" font-family="monospace" font-size="10px" fill="#64748B">Mechanism: Dynamic Reroute</text>
        <text x="0" y="60" font-family="monospace" font-size="10px" fill="#64748B">Horizon: 14-Day Trajectory</text>
      </g>
    </g>

    <!-- CARD 2: SLA Penalties Saved -->
    <g transform="translate(260, 0)">
      <rect width="235" height="260" rx="12" fill="#0F172A" stroke="#00F2FE" stroke-width="1.5"/>
      <rect x="16" y="16" width="6" height="22" rx="3" fill="#00F2FE"/>
      <text x="30" y="32" class="card-label" fill="#7DD3FC">PENALTY REDUCTION</text>

      <text x="16" y="78" class="metric-big" fill="#00F2FE">-$12,400</text>
      <text x="16" y="98" font-family="'Segoe UI', sans-serif" font-size="12px" fill="#BAE6FD">Per Disrupted Corridor Batch</text>

      <!-- Animated Progress Bar -->
      <rect x="16" y="125" width="200" height="10" rx="5" fill="#1E293B"/>
      <rect x="16" y="125" height="10" rx="5" fill="url(#gradCyan)" class="bar-anim-2"/>

      <g transform="translate(16, 160)">
        <text x="0" y="0" font-family="monospace" font-size="11px" fill="#94A3B8">Baseline fines: $48,200/qtr</text>
        <text x="0" y="20" font-family="monospace" font-size="11px" fill="#38BDF8">Avoided fines: $35,800/qtr</text>
        <text x="0" y="40" font-family="monospace" font-size="10px" fill="#64748B">Tool: MCP Auto-Reassign</text>
        <text x="0" y="60" font-family="monospace" font-size="10px" fill="#64748B">Corridor: XpressBees Lane</text>
      </g>
    </g>

    <!-- CARD 3: Query Latency -->
    <g transform="translate(520, 0)">
      <rect width="235" height="260" rx="12" fill="#0F172A" stroke="#C084FC" stroke-width="1.5"/>
      <rect x="16" y="16" width="6" height="22" rx="3" fill="#C084FC"/>
      <text x="30" y="32" class="card-label" fill="#E9D5FF">QUERY LATENCY</text>

      <text x="16" y="78" class="metric-big" fill="#C084FC">&lt; 1.8 ms</text>
      <text x="16" y="98" font-family="'Segoe UI', sans-serif" font-size="12px" fill="#E9D5FF">99.9% Sub-Millisecond Speed</text>

      <!-- Animated Progress Bar -->
      <rect x="16" y="125" width="200" height="10" rx="5" fill="#1E293B"/>
      <rect x="16" y="125" height="10" rx="5" fill="url(#gradPurple)" class="bar-anim-3"/>

      <g transform="translate(16, 160)">
        <text x="0" y="0" font-family="monospace" font-size="11px" fill="#94A3B8">Legacy BI ticket: 2 - 4 hrs</text>
        <text x="0" y="20" font-family="monospace" font-size="11px" fill="#C084FC">Semantic Cache: 1.8 ms</text>
        <text x="0" y="40" font-family="monospace" font-size="10px" fill="#64748B">Live Cortex Query: 185 ms</text>
        <text x="0" y="60" font-family="monospace" font-size="10px" fill="#64748B">Zero-Drift Attestation</text>
      </g>
    </g>

    <!-- CARD 4: Delay Risk Accuracy -->
    <g transform="translate(780, 0)">
      <rect width="235" height="260" rx="12" fill="#0F172A" stroke="#FBBF24" stroke-width="1.5"/>
      <rect x="16" y="16" width="6" height="22" rx="3" fill="#FBBF24"/>
      <text x="30" y="32" class="card-label" fill="#FDE68A">PREDICTIVE ROC-AUC</text>

      <text x="16" y="78" class="metric-big" fill="#FBBF24">0.9664</text>
      <text x="16" y="98" font-family="'Segoe UI', sans-serif" font-size="12px" fill="#FEF3C7">89.58% Delay Risk Accuracy</text>

      <!-- Animated Progress Bar -->
      <rect x="16" y="125" width="200" height="10" rx="5" fill="#1E293B"/>
      <rect x="16" y="125" height="10" rx="5" fill="url(#gradAmber)" class="bar-anim-4"/>

      <g transform="translate(16, 160)">
        <text x="0" y="0" font-family="monospace" font-size="11px" fill="#94A3B8">Model: RandomForest + DL</text>
        <text x="0" y="20" font-family="monospace" font-size="11px" fill="#FBBF24">F1 Score: 0.8075</text>
        <text x="0" y="40" font-family="monospace" font-size="10px" fill="#64748B">Advance Warning: 24 - 48 hrs</text>
        <text x="0" y="60" font-family="monospace" font-size="10px" fill="#64748B">Evaluated on: 25,000 TMS</text>
      </g>
    </g>

  </g>
</svg>
